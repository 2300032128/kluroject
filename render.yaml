services:
  # FastAPI Backend Service
  - type: web
    name: eduagent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        value: "sqlite:///./eduagent.db"
      - key: GEMINI_API_KEY
        sync: false
