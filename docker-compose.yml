version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduagent-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DEMO_MODE=true
      - DATABASE_URL=sqlite:///./eduagent.db
    volumes:
      - ./backend/eduagent.db:/app/eduagent.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduagent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: always
